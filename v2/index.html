<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tachyon Sprint</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Sizes follow the window (its height, or its width when it is narrow), so
   the display reads the same at 1280 by 720 as in full screen. */
:root{--u:clamp(8px,min(1.95vh,1.25vw),26px);--ink:#f4f6f8;--dim:#aab3bf;--panel:rgba(9,12,17,.78);--edge:rgba(255,255,255,.14);
  --red:#ff3b30;--green:#32e08a;--amber:#ffc83d;--violet:#c58bff;--blue:#4db8ff}
html,body{margin:0;height:100%;background:#0b0d10;color:var(--ink);overflow:hidden;
  font:500 var(--u)/1.25 "Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;user-select:none}
#wrap{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block;outline:none}
[hidden]{display:none!important}

/* ------------------------------------------------------------ display */
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
body.driving #hud{opacity:1}
html.clean #hud{display:none}
.block{position:absolute;background:var(--panel);border:1px solid var(--edge);border-radius:.35em;
  box-shadow:0 .2em 1.2em rgba(0,0,0,.35)}
.tag{font-size:.72em;font-weight:600;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.big{font-weight:700;font-style:italic;line-height:.9}

#standing{left:1.6em;top:1.4em;display:flex;align-items:stretch;overflow:hidden}
#standing>div{padding:.55em 1.1em .6em;display:flex;flex-direction:column;justify-content:center}
#standing>div+div{border-left:1px solid var(--edge)}
#standing .big{font-size:2.9em}
#standing small{font-size:.42em;font-style:normal;font-weight:600;color:var(--dim);margin-left:.12em}
body[data-mode=trial] .race-only{display:none!important}
body[data-mode=race] .trial-only{display:none!important}
#place-box{background:var(--red);color:#fff}
#place-box .tag,#place-box small{color:rgba(255,255,255,.85)}
#trial-box .big{font-size:1.5em;font-style:normal;letter-spacing:.06em}
#target{font-weight:700;font-size:1.15em}
#target[data-kind=gold],.medal.gold{color:#ffd24a}#target[data-kind=silver],.medal.silver{color:#d5dde6}#target[data-kind=bronze],.medal.bronze{color:#e39a5c}
#ghost{font-size:.72em;letter-spacing:.12em;color:var(--blue);font-weight:600}

/* The order of the field (H10): a row a car, drawn straight on the picture
   as the references' towers are; each row is moved to its place, so cars
   are seen to change places. Under it the gaps on the road (H4). */
#order{position:absolute;left:1.6em;top:7.1em;width:16.4em}
#tower{position:relative;font-size:.95em;--row:1.74em}
#tower .car{position:absolute;left:0;right:0;top:0;height:1.6em;display:flex;align-items:center;font-weight:600;
  background:linear-gradient(90deg,rgba(9,12,17,.9),rgba(9,12,17,.66));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#tower .car b{flex:none;width:1.75em;align-self:stretch;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-style:italic;background:rgba(255,255,255,.1)}
#tower .car i{flex:none;width:.3em;align-self:stretch;background:var(--c)}
#tower .car u{flex:none;width:1.9em;text-align:right;text-decoration:none;font-size:.8em;font-weight:700;color:var(--dim)}
#tower .car span{flex:1;padding-left:.5em;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
#tower .car em{flex:none;padding-right:.6em;font-style:normal;font-size:.92em;font-variant-numeric:tabular-nums;color:#dfe5ec}
#tower .car em[data-kind=word]{font-size:.7em;letter-spacing:.14em;color:var(--dim)}
#tower .car.you{background:#f4f6f8;color:#0b0d10;z-index:1}
#tower .car.you b{background:var(--red);color:#fff}#tower .car.you u{color:#4a525e}#tower .car.you em{color:#0b0d10}
#tower .car[data-state=out] span,#tower .car[data-state=out] u{opacity:.5}
#tower .car[data-state=finished] em::before{content:"";display:inline-block;width:.8em;height:.8em;margin-right:.4em;vertical-align:-.08em;
  background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/.4em .4em}
#gaps{display:flex;gap:.4em;margin-top:.45em}
#gaps>div{flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:.4em;padding:.28em .6em .3em;white-space:nowrap;
  background:linear-gradient(90deg,rgba(9,12,17,.9),rgba(9,12,17,.66))}
#gaps>div:has([data-kind=none]){visibility:hidden}
#gaps .tag{font-size:.74em;letter-spacing:.1em}
#gap-ahead,#gap-behind{font-weight:700;font-size:1.2em;font-variant-numeric:tabular-nums}
#gap-ahead{color:var(--amber)}#gap-behind{color:var(--green)}
#pen-row span:last-child{color:var(--amber)}#pen-row[hidden]{display:none}
#pen-why{margin-left:.3em;font-style:normal;letter-spacing:.04em;text-transform:none;color:var(--amber);white-space:nowrap}

#timing{right:1.6em;top:1.4em;padding:.6em 1.1em .7em;min-width:13.5em}
#timing .row{display:flex;justify-content:space-between;align-items:baseline;gap:1.4em}
#timing .row span:last-child{font-weight:700;font-size:1.25em}
#timing .now span:last-child{font-size:2.05em;font-style:italic}
#delta{display:block;margin:.35em 0 .1em;padding:.12em .6em;border-radius:.25em;text-align:right;font-weight:700;font-size:1.45em}
#delta[data-kind=none]{display:none}
#delta[data-kind=ahead]{background:rgba(50,224,138,.18);color:var(--green)}
#delta[data-kind=behind]{background:rgba(255,59,48,.2);color:#ff7168}
#delta[data-kind=level]{background:rgba(255,255,255,.1)}
#sectors{display:flex;gap:.3em;margin-top:.5em}
#sectors div{flex:1;text-align:center;padding:.18em 0 .22em;border-radius:.2em;background:rgba(255,255,255,.07);border-bottom:.18em solid transparent}
#sectors b{display:block;font-size:.62em;letter-spacing:.14em;color:var(--dim);font-weight:600}
#sectors span{font-weight:700;font-size:.95em}
#sectors span[data-kind=best]{color:var(--violet)}#sectors div:has(span[data-kind=best]){border-color:var(--violet)}
#sectors span[data-kind=slower]{color:var(--amber)}#sectors div:has(span[data-kind=slower]){border-color:var(--amber)}
#sectors div:has(span[data-kind=now]){border-color:var(--ink)}
#sectors div.last-lap{opacity:.7}

#dash{right:1.6em;bottom:1.5em;padding:.7em 1.1em .8em;width:17em}
#leds{display:flex;gap:.22em;margin-bottom:.55em}
#leds i{flex:1;height:.55em;border-radius:.14em;background:rgba(255,255,255,.12)}
#leds i.low{background:var(--green);box-shadow:0 0 .5em var(--green)}
#leds i.mid{background:var(--amber);box-shadow:0 0 .5em var(--amber)}
#leds i.high{background:var(--red);box-shadow:0 0 .5em var(--red)}
#leds i.change{background:var(--blue);box-shadow:0 0 .7em var(--blue)}
#dial{display:flex;align-items:flex-end;justify-content:space-between}
#gear-box{width:3.3em;height:3.6em;border:.14em solid var(--ink);border-radius:.4em;display:flex;align-items:center;justify-content:center}
#gear{font-size:3em}
#speed{font-size:4.6em;text-align:right;min-width:2.2em}
#speed-box{text-align:right}
#revs{position:relative;height:.5em;margin-top:.6em;border-radius:.25em;background:rgba(255,255,255,.12);overflow:hidden}
#revs-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#e9eef4,#fff)}
#revs-red{position:absolute;top:0;bottom:0;right:0;background:rgba(255,59,48,.55);mix-blend-mode:screen}
#revs-row{display:flex;justify-content:space-between;margin-top:.25em}

#map{left:1.6em;bottom:1.5em;width:11.5em;height:11.5em;padding:.5em;background:rgba(8,10,14,.5)}
#map svg{width:100%;height:100%;overflow:visible}
#map-road{fill:none;stroke:rgba(255,255,255,.92);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
#map-line{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:butt}
#map-me{fill:var(--red);stroke:#fff;stroke-width:1.2}
#map-cars circle{stroke:rgba(0,0,0,.75);stroke-width:.8}
#map-other{fill:var(--blue);stroke:#fff;stroke-width:1}
#map-other[data-kind=none]{display:none}
#map-other[data-kind=ghost]{fill:rgba(160,220,255,.6)}
body.readout #map{display:none}
#top{position:absolute;left:50%;top:1.4em;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.6em}
#lights{display:flex;gap:.55em;padding:.55em .7em;background:#06080b;border:1px solid var(--edge);border-radius:.5em}
#lights[data-on=no]{display:none}
#lights i{width:2.1em;height:2.1em;border-radius:50%;background:#2a0b0a;box-shadow:inset 0 0 .5em #000}
#lights i.lit{background:radial-gradient(circle at 40% 35%,#ff9a8f,var(--red) 55%,#b01208);box-shadow:0 0 1.4em rgba(255,59,48,.9)}
.message{padding:.3em 1.2em .34em;font-weight:700;font-size:1.5em;letter-spacing:.06em;white-space:nowrap;
  background:var(--panel);border:1px solid var(--edge);border-radius:.3em;animation:arrive .18s ease-out}
.message.best{color:var(--violet);border-color:var(--violet)}.message.note{color:var(--amber)}
.message.warn{color:#ff7168;border-color:var(--red)}.message.flag{background:#fff;color:#0b0d10;font-size:2em}
@keyframes arrive{from{opacity:0;transform:translateY(-.4em)}}
#wrong{padding:.3em 1.4em;font-weight:700;font-size:2.2em;letter-spacing:.1em;background:var(--red);color:#fff;border-radius:.3em}
/* A way back, offered to a car that is stuck or turned round (D11). */
#wayback{position:absolute;left:50%;top:31%;transform:translateX(-50%);display:flex;align-items:center;gap:1em;padding:.5em 1.1em .55em;
  white-space:nowrap;font-weight:700;font-size:1.45em;letter-spacing:.08em;text-transform:uppercase;background:var(--panel);
  border:1px solid var(--edge);border-left:.24em solid var(--amber);border-radius:.3em;animation:offered .2s ease-out}
#wayback kbd{display:inline-block;min-width:1.1em;margin-right:.2em;padding:.04em .42em .08em;font:inherit;letter-spacing:.02em;text-align:center;
  color:#0b0d10;background:#fff;border-radius:.22em;box-shadow:0 .14em 0 rgba(0,0,0,.5)}
#way-reverse{padding-left:1em;border-left:1px solid var(--edge);color:#d3d9e0}
@keyframes offered{from{opacity:0}}
/* What the car has struck (D13): a plan of it, nose up, a mark a hit. */
#damage{right:21.2em;bottom:1.5em;padding:.5em .7em .55em;display:flex;flex-direction:column;align-items:center;gap:.3em}
#damage svg{width:4.8em;height:9.6em;display:block;overflow:visible}
#damage-car{fill:rgba(255,255,255,.16);stroke:rgba(255,255,255,.85);stroke-width:.07}
#damage-svg .glass{fill:rgba(255,255,255,.2)}#damage-svg .tyre{fill:rgba(255,255,255,.75)}
#damage-svg .wing{fill:none;stroke:rgba(255,255,255,.85);stroke-width:.12;stroke-linecap:round}
#damage-marks circle{fill-opacity:.8;stroke:rgba(0,0,0,.6);stroke-width:.04}
#damage-marks circle[data-heavy=true]{stroke:#fff;stroke-width:.07}
#worn{color:#ff7168;letter-spacing:.1em}#worn:empty{display:none}
html.clean #wayback,html.clean #damage{display:none}
#pause-button{position:absolute;left:50%;bottom:1.5em;transform:translateX(-50%);pointer-events:auto;cursor:pointer;
  padding:.3em .9em;font:inherit;font-size:.8em;font-weight:600;letter-spacing:.14em;color:var(--dim);background:var(--panel);
  border:1px solid var(--edge);border-radius:.3em}
#pause-button{opacity:0;transition:opacity .2s}body.pointing #pause-button,#pause-button:hover{opacity:1}
#pause-button:hover{color:#0b0d10;background:#fff}
body:not([data-screen=drive]) #pause-button{display:none}
#notice{position:fixed;left:50%;top:1.4em;transform:translateX(-50%);padding:.35em 1.2em;font-weight:700;letter-spacing:.1em;
  color:var(--amber);background:var(--panel);border:1px solid var(--edge);border-radius:.3em;z-index:3}
#readout{display:none;position:absolute;left:1.6em;bottom:1.5em;padding:.5em .8em;font:11px/1.5 ui-monospace,Menlo,monospace;white-space:pre;background:var(--panel);border-radius:.3em}
body.readout #readout{display:block}

/* -------------------------------------------------------------- menus */
/* One frame for every screen (F5 to F13): a panel of one size, in one
   place, whatever is chosen; in it the title, the tabs of a screen with
   pages, the list beside the chosen item's note, and the keys' line. Its
   own unit follows the window, never under 12 px. The panel is dark
   enough that its text reads over a white frame (F10). */
#menu{position:fixed;inset:0;--m:clamp(12px,min(2.1vh,1.3vw),28px);--w:min(44em,calc(100vw - 2em));font-size:var(--m);
  background:linear-gradient(90deg,rgba(8,10,14,.95) calc(max(1em,5vw) + var(--w)),rgba(8,10,14,.45) calc(max(1em,5vw) + var(--w) + 10em),rgba(8,10,14,.08) calc(max(1em,5vw) + var(--w) + 26em))}
body[data-screen=pause] #menu,body[data-screen=qualified] #menu,body[data-screen=result] #menu{background:linear-gradient(90deg,rgba(8,10,14,.95) calc(max(1em,5vw) + var(--w)),rgba(8,10,14,.6) calc(max(1em,5vw) + var(--w) + 10em))}
.card{position:absolute;left:max(1em,5vw);top:0;bottom:0;margin:auto 0;height:min(88vh,38em);width:var(--w);box-sizing:border-box;
  display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:1.2em 0 .9em}
.card>header{grid-row:1}.card>.tabs{grid-row:2}.card>.main{grid-row:3}.card>.keys{grid-row:4}
.card h1{margin:0;font-size:2.3em;font-style:italic;font-weight:800;letter-spacing:.02em;line-height:1}
.card h1::after{content:"";display:block;width:2em;height:.1em;background:var(--red);margin:.22em 0 .3em}
.lead{margin:-.1em 0 .7em;color:#c9d0d8;font-size:1.1em}
/* The pages of a screen: Q and E (or LB and RB) at either end. */
.tabs{display:flex;align-items:stretch;gap:.3em;margin:0 0 .7em}
.tab{flex:1 1 auto;min-width:0;font:inherit;font-weight:700;padding:.4em .2em;color:#dfe4ea;cursor:pointer;white-space:nowrap;overflow:hidden;
  background:rgba(255,255,255,.07);border:0;border-bottom:.2em solid transparent;border-radius:.18em .18em 0 0}
.tab.on{color:#fff;background:rgba(255,255,255,.16);border-bottom-color:var(--red)}
.tab-key{display:flex;align-items:center;cursor:pointer}
.main{display:grid;grid-template-columns:minmax(0,23em) minmax(0,1fr);gap:1.4em;min-height:0}
/* The two results: the sheet across the panel, the choices in a row under it. */
body[data-screen=qualified] .main,body[data-screen=result] .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:.8em}
body[data-screen=qualified] .list,body[data-screen=result] .list{grid-row:2;flex-direction:row}
body[data-screen=qualified] .list .item,body[data-screen=result] .list .item{flex:1 1 0;min-width:0}
body[data-screen=soundtest] .main{grid-template-columns:minmax(0,29em) minmax(0,1fr)}
/* What starts or resumes: set apart from the settings under it, a play mark before it. */
.item.go{font-weight:800;letter-spacing:.03em}.item.go .label::before{content:"▶";display:inline-block;width:1.1em;font-size:.75em;color:var(--red);vertical-align:.08em}
.item.go.last{margin-bottom:.7em}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3em;min-height:0;overflow:hidden}
.item{flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;gap:.6em;height:2.25em;padding:0 .5em 0 1em;box-sizing:border-box;
  font-size:1.15em;font-weight:600;cursor:pointer;white-space:nowrap;background:rgba(255,255,255,.07);border-radius:.18em}
/* The choice: light on dark the other way round, and a bar only it has (F8). */
.item .mark{position:absolute;left:0;top:0;bottom:0;width:.3em;background:var(--red);border-radius:.18em 0 0 .18em;visibility:hidden}
.item.on{background:#fff;color:#0b0d10}.item.on .mark{visibility:visible}
.item.off{color:#a3acb8;cursor:default;background:rgba(255,255,255,.03)}
.label{overflow:hidden;text-overflow:ellipsis}
.value{flex:none;display:flex;align-items:center;justify-content:flex-end;font-weight:500;max-width:62%}
.value>span{overflow:hidden;text-overflow:ellipsis}
/* A value between its arrows keeps one width, so the arrows stay put (F5). */
.turns .value{width:9em;display:grid;grid-template-columns:1.6em minmax(0,1fr) 1.6em;text-align:center}
.value b{font-weight:800;font-size:1.25em;line-height:1;text-align:center;color:#c9d0d8;cursor:pointer}.item.on .value b{color:var(--red)}
.value .number{display:inline-block;width:1.4em;margin-left:.3em;font-style:normal;text-align:right}
/* A volume: a bar filled to its level, then its number. */
.value .bar{display:inline-block;width:4.6em;height:.5em;vertical-align:.12em;border-radius:.25em;border:1px solid currentColor;
  background:linear-gradient(90deg,currentColor calc(var(--v) * 10%),transparent 0)}.turns .value .bar{width:3.6em}
.note{min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:.1em 0 0 1.3em;border-left:1px solid rgba(255,255,255,.14)}
.note h2{margin:0 0 .45em;font-size:1.15em;font-weight:700;line-height:1.2}
.note p{margin:0 0 .6em;line-height:1.4;color:#e1e6eb}
.note-foot{margin-top:auto;padding-top:.5em;border-top:1px solid rgba(255,255,255,.14)}
.note-foot h3{margin:0 0 .3em;font-size:1em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#c9d0d8}
.note-foot p{margin:0 0 .3em;color:#d3d9e0}
.facts{display:flex;flex-wrap:wrap;gap:.3em 1.4em}.facts b{color:#fff;font-size:1.15em;margin-left:.3em}
.medal i{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:currentColor;margin-right:.4em}
em.medal{font-style:normal;font-weight:700;margin-left:.8em}
/* The keys' line: each key in a cap, the one that goes back a button (F9). */
.keys{display:flex;flex-wrap:wrap;align-items:center;gap:.35em 1.3em;margin:.8em 0 0;padding-top:.7em;border-top:1px solid rgba(255,255,255,.14);
  font-size:1em;font-weight:600;color:#e1e6eb}
.keys>span,.keys .back>span,.tab-key>span{display:inline-flex;align-items:center;gap:.4em;white-space:nowrap}
.tab-key kbd{font-size:1em!important}
.keys kbd,.tab-key kbd{display:inline-block;min-width:1.3em;margin-right:.15em;padding:.05em .35em;box-sizing:border-box;font:inherit;font-weight:800;font-size:.95em;text-align:center;
  color:#0b0d10;background:#e9edf1;border-radius:.2em}
.keys .back{margin-left:auto;font:inherit;color:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:.25em;padding:.2em .6em;cursor:pointer}
.keys .back:hover{background:rgba(255,255,255,.18)}
.for-pad{display:none}body.pad .for-pad{display:inline}body.pad .for-keys{display:none}
.keys .for-keys,.keys .for-pad,.tab-key .for-keys,.tab-key .for-pad{display:none}
body:not(.pad) .keys .for-keys,body:not(.pad) .tab-key .for-keys,body.pad .keys .for-pad,body.pad .tab-key .for-pad{display:inline-flex}
#driver-name{font:inherit;font-weight:700;letter-spacing:.08em;text-transform:uppercase;width:7.6em;padding:.05em .4em;color:inherit;cursor:text;
  background:transparent;border:1px solid transparent;border-bottom:1px dashed currentColor;border-radius:.2em;outline:none;text-align:right}
#driver-name:focus{text-align:left;border-color:var(--red);background:#fff;color:#0b0d10;box-shadow:0 0 0 2px var(--red)}
/* The results: the place first and largest, then the table. */
.sheet{padding:0;border:0}
.headline{display:flex;align-items:baseline;flex-wrap:wrap;gap:.2em .7em;margin:0 0 .5em}
.place-big{font-size:3em;font-weight:800;font-style:italic;line-height:.95}
.sum{color:#e1e6eb}.sum b{color:#fff}
.result{width:100%;border-collapse:collapse;table-layout:fixed;margin:0 0 .7em}
.result .c-place{width:2.2em}.result .c-time{width:6.8em}.result .c-gap{width:5.2em}
.result th{text-align:right;font-size:1em;font-weight:700;letter-spacing:.1em;color:#c9d0d8;text-transform:uppercase;padding:.2em .5em}
.result th:nth-child(2){text-align:left}
.result td{text-align:right;padding:.22em .5em;font-weight:600;border-top:1px solid rgba(255,255,255,.14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result td i{display:inline-block;min-width:1.7em;margin-right:.5em;padding:0 .2em;font-style:normal;font-size:1em;text-align:center;
  border-left:.3em solid var(--c);background:rgba(255,255,255,.12)}
.result td small{color:#c9d0d8;font-weight:500}
.result td:nth-child(2){text-align:left}.result td:first-child{font-style:italic;font-weight:800;text-align:center}
.result tr.you td{background:#fff;color:#0b0d10}.result tr.you td small{color:#3a424d}.result tr.you td i{background:rgba(0,0,0,.08)}
.result td.fastest{color:var(--violet)}.result tr.you td.fastest{color:#6d2bb3}
